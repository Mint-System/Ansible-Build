---
- name: Create {{ role_name }} log file
  ansible.builtin.copy:
    content: ""
    dest: /var/log/cron.log
    force: false

- name: Check rsyslog default config exists
  ansible.builtin.stat:
    path: /etc/rsyslog.d/50-default.conf
  register: cron_rsyslog_default

- name: Ensure rsyslog {{ role_name }} is enabled
  ansible.builtin.lineinfile:
    path: /etc/rsyslog.d/50-default.conf
    regexp: cron.*
    insertafter: "#cron.*"
    line: cron.*                          /var/log/cron.log
  notify: Restart rsyslog service
  when: cron_rsyslog_default.stat.exists
