---
- name: Determine IP address(es) of proxy host
  ansible.builtin.set_fact:
    proxy_host_ips: >-
      {{ [ansible_host]
         if (ansible_host is match('^[0-9]{1,3}([.][0-9]{1,3}){3}$') or ':' in ansible_host)
         else lookup('dig', ansible_host).split(',') | map('trim') | list }}
  tags:
    - check

- name: Fail if src hostname does not point to proxy host
  ansible.builtin.fail:
    msg: >-
      DNS record for {{ item.src_hostname }} ({{ src_ips | join(', ') }})
      does not point to proxy host ({{ proxy_host_ips | join(', ') }}).
  vars:
    src_ips: "{{ lookup('dig', item.src_hostname).split(',') | map('trim') | list }}"
  loop: "{{ nginx_proxies | selectattr('tls', 'defined') | selectattr('tls') | list }}"
  loop_control:
    label: "{{ item.src_hostname }}"
  when:
    - src_ips != ['NXDOMAIN']
    - src_ips | intersect(proxy_host_ips) | length == 0
  tags:
    - check
