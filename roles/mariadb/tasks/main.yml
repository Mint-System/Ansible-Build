---
- name: Include {{ role_name }} tasks
  ansible.builtin.include_tasks: "{{ role_name }}.yml"
  when: mariadb_image is defined
  tags:
    - mariadb

- name: Include docker {{ role_name }} backup from restic
  ansible.builtin.include_role:
    name: restic
    tasks_from: restic_docker_mysql_backup.yml
  vars:
    restic_backup_set: "{{ mariadb_backup_set }}"
  when: mariadb_backup_set is defined and mariadb_backup_set | length > 0
