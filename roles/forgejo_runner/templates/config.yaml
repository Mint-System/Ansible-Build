log:
  level: info

server:
  connections:
{% for connection in forgejo_runner_connections %}
    {{ connection.name }}:
      url: "{{ connection.url }}"
      uuid: "{{ connection.uuid }}"
      token: "{{ connection.token }}"
      labels:
{% for label in connection.labels | default(forgejo_runner_labels) %}
        - "{{ label }}"
{% endfor %}
{% endfor %}
