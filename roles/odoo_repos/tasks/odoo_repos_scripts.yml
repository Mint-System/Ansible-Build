---
- name: Ensure {{ role_name }} scripts dir exists
  ansible.builtin.file:
    path: "{{ odoo_repos_scripts_dir }}"
    state: directory

- name: Copy {{ role_name }} scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ odoo_repos_scripts_dir }}/{{ item }}"
    mode: +x
  loop:
    - odoo-repos-list
    - odoo-repos-clone
    - odoo-repos-pull
