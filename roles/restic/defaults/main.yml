---
restic_backup_dir: /var/backup
restic_owner: root
restic_group: backup
restic_repo_type: rest
restic_rest_user: restic
restic_rest_password: "{{ vault_restic_rest_password }}"
restic_repo_password: "{{ vault_restic_repo_password }}"
restic_backup_rotation:
  last: 14
  daily: 14
  weekly: 4
  monthly: 3
