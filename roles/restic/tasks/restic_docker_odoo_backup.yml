---
- name: Verify docker-odoo-backup command exists
  ansible.builtin.command: command -v docker-odoo-backup
  changed_when: false
  loop: "{{ restic_backup_set }}"
  when: item.type == "docker-odoo-backup"

- name: Register odoo backup jobs
  ansible.builtin.cron:
    name: "{{ item.id }}"
    hour: "{{ item.hour }}"
    minute: "{{ 59 | random(seed=item.id) }}"
    job: docker-odoo-backup -d {{ item.database }} -c {{ item.container }} -o {{ restic_backup_dir }} -f tar {{ '&& restic-main backup ' + restic_backup_dir +
      '/' + item.database + '.tar --tag ' + (item.tags | join(' --tag ')) if item.upload | default(true) else '' }}; write-node-exporter-metric -c '{{ item.id
      }}' -v $?
    disabled: "{{ item.disabled | default(false) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ restic_backup_set }}"
  when: item.type == "docker-odoo-backup"
