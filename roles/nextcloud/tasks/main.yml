---
- name: On build set new image tag {{ role_name }}:{{ nextcloud_hostname }}
  ansible.builtin.set_fact:
    nextcloud_image: nextcloud:{{ nextcloud_hostname }}
    nextcloud_build_image: "{{ nextcloud_image }}"
  when: nextcloud_build_image and nextcloud_build_image != nextcloud_image
  tags:
    - nextcloud

- name: Include {{ role_name }} build tasks
  ansible.builtin.include_tasks: "{{ role_name }}_build.yml"
  when: nextcloud_build_image and nextcloud_build_image != nextcloud_image
  tags:
    - nextcloud

- name: Include {{ role_name }} tasks
  ansible.builtin.include_tasks: "{{ role_name }}.yml"
  when: nextcloud_image is defined
  tags:
    - nextcloud

# Apply the occ config unless the container image was just upgraded: then the
# entrypoint is still running the upgrade and the config tasks are deferred to the
# next deployment. Fresh deployments (no existing container) are configured right away.
# Compare the tag (Config.Image), not the raw inspect Image which is the image ID.
- name: Include {{ role_name }} config tasks
  ansible.builtin.include_tasks: "{{ role_name }}_config.yml"
  when: nextcloud_image is defined and (not nextcloud_container_before.exists | default(false) or (nextcloud_container_before.container.Config.Image | default('') | split('/') | last == nextcloud_image | split('/') | last))
  tags:
    - nextcloud
