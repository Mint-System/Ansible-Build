---
- name: Reset infomaniak DNS present fact for {{ zone_name }}
  ansible.builtin.set_fact:
    infomaniak_dns_present: []

- name: Set infomaniak DNS present fact for {{ zone_name }}
  ansible.builtin.set_fact:
    infomaniak_dns_present: "{{ infomaniak_dns_present + [{'key': (record.source if record.source != '' else '.') + '-' + record.type + '-' + record.target, 'id':
      record.id, 'source': (record.source if record.source != '' else '.'), 'type': record.type, 'target': record.target, 'ttl': record.ttl}] }}"
  loop: "{{ current_records }}"
  loop_control:
    loop_var: record

- name: Show DNS present list for {{ zone_name }}
  debug:
    var: infomaniak_dns_present

- name: Reset normalized desired records for {{ zone_name }}
  ansible.builtin.set_fact:
    infomaniak_desired_records: []

- name: Normalize desired records for {{ zone_name }}
  ansible.builtin.set_fact:
    infomaniak_desired_records: "{{ infomaniak_desired_records + [record | combine({'source': _source, 'target': _target, 'key': _source + '-' + record.type + '-'
      + _target})] }}"
  loop: "{{ zone_records }}"
  loop_control:
    loop_var: record
    label: "{{ record.source if record.source != '' else '.' }} ({{ record.type }})"
  vars:
    _source: "{{ record.source if record.source != '' else '.' }}"
    _target: >-
      {%- if record.type == 'MX' -%}
        {{ record.target if (record.target is string and record.target.startswith('10 ')) else '10 ' + record.target }}
      {%- elif record.type == 'TXT' -%}
        {{ record.target if (record.target is string and record.target.startswith('"') and record.target.endswith('"')) else '"' + record.target + '"' }}
      {%- else -%}
        {{ record.target }}
      {%- endif -%}

- name: Create new DNS records for {{ zone_name }}
  ansible.builtin.uri:
    url: "{{ infomaniak_api_url }}{{ zone_name }}/records"
    method: POST
    headers:
      Authorization: "Bearer {{ infomaniak_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      source: "{{ record.source }}"
      type: "{{ record.type }}"
      target: "{{ record.target }}"
      ttl: "{{ record.ttl | default(3600) }}"
    status_code: [200, 201]
    return_content: true
  register: create_result
  loop: "{{ infomaniak_desired_records }}"
  loop_control:
    loop_var: record
    label: "{{ record.source }} ({{ record.type }})"
  when:
    - record.state == 'present'
    - record.key not in (infomaniak_dns_present | map(attribute='key') | list)

- name: Update TTL on unchanged DNS records for {{ zone_name }}
  ansible.builtin.uri:
    url: "{{ infomaniak_api_url }}{{ zone_name }}/records/{{ existing_entry.id }}"
    method: PUT
    headers:
      Authorization: "Bearer {{ infomaniak_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      source: "{{ record.source }}"
      type: "{{ record.type }}"
      target: "{{ record.target }}"
      ttl: "{{ record.ttl }}"
    status_code: [200, 201]
    return_content: true
  register: update_result
  loop: "{{ infomaniak_desired_records }}"
  loop_control:
    loop_var: record
    label: "{{ record.source }} ({{ record.type }})"
  vars:
    _matched: "{{ infomaniak_dns_present | selectattr('key', 'equalto', record.key) | list }}"
    existing_entry: "{{ _matched[0] if _matched | length > 0 else {} }}"
  when:
    - record.state == 'present'
    - record.ttl is defined
    - _matched | length > 0
    - existing_entry.ttl != record.ttl

- name: Delete DNS records for {{ zone_name }}
  ansible.builtin.uri:
    url: "{{ infomaniak_api_url }}{{ zone_name }}/records/{{ existing_entry.id }}"
    method: DELETE
    headers:
      Authorization: "Bearer {{ infomaniak_token }}"
    status_code: [200, 204]
    return_content: true
  register: delete_result
  loop: "{{ infomaniak_desired_records | selectattr('state', 'equalto', 'absent') | list }}"
  loop_control:
    loop_var: record
    label: "{{ record.source }} ({{ record.type }})"
  vars:
    _matched: "{{ infomaniak_dns_present | selectattr('key', 'equalto', record.key) | list }}"
    existing_entry: "{{ _matched[0] if _matched | length > 0 else {} }}"
  when:
    - _matched | length > 0
