---
- name: Reset infomaniak DNS present fact for {{ zone_name }}
  ansible.builtin.set_fact:
    infomaniak_dns_present: []

- name: Set infomaniak DNS present fact for {{ zone_name }}
  ansible.builtin.set_fact:
    infomaniak_dns_present: "{{ infomaniak_dns_present + [{'key': (record.source if record.source != '' else '.') + '-' + record.type + '-' + record.target, 'id': record.id, 'source': (record.source if record.source != '' else '.'), 'type': record.type, 'target': record.target, 'ttl': record.ttl}] }}"
  loop: "{{ current_records }}"
  loop_control:
    loop_var: record

- name: Show DNS present list for {{ zone_name }}
  debug:
    var: infomaniak_dns_present

- name: Compute desired record keys for {{ zone_name }}
  ansible.builtin.set_fact:
    infomaniak_desired_keys: []

- name: Build desired record keys for {{ zone_name }}
  ansible.builtin.set_fact:
    infomaniak_desired_keys: "{{ infomaniak_desired_keys + [_key] }}"
  loop: "{{ zone_records | selectattr('state', 'equalto', 'present') | list }}"
  loop_control:
    loop_var: record
    label: "{{ record.source if record.source != '' else '.' }} ({{ record.type }})"
  vars:
    _record_target: >-
      {{
        record.target
        if record.type != 'MX'
        else (
          record.target
          if record.target is string and record.target.startswith('10 ')
          else ('10 ' ~ record.target)
        )
      }}
    _key: "{{ (record.source if record.source != '' else '.') }}-{{ record.type }}-{{ _record_target }}"

- name: Create new DNS records for {{ zone_name }}
  ansible.builtin.uri:
    url: "{{ infomaniak_api_url }}{{ zone_name }}/records"
    method: POST
    headers:
      Authorization: "Bearer {{ infomaniak_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      source: "{{ record.source if record.source != '' else '.' }}"
      type: "{{ record.type }}"
      target: "{{ _record_target }}"
      ttl: "{{ record.ttl | default(3600) }}"
    status_code: [200, 201]
    return_content: true
  register: create_result
  vars:
    _record_target: >-
      {{
        record.target
        if record.type != 'MX'
        else (
          record.target
          if record.target is string and record.target.startswith('10 ')
          else ('10 ' ~ record.target)
        )
      }}
    _key: "{{ (record.source if record.source != '' else '.') }}-{{ record.type }}-{{ _record_target }}"
  loop: "{{ zone_records }}"
  loop_control:
    loop_var: record
    label: "{{ record.source if record.source != '' else '.' }} ({{ record.type }})"
  when:
    - record.state == 'present'
    - _key not in (infomaniak_dns_present | map(attribute='key') | list)

- name: Update TTL on unchanged DNS records for {{ zone_name }}
  ansible.builtin.uri:
    url: "{{ infomaniak_api_url }}{{ zone_name }}/records/{{ existing_entry.id }}"
    method: PUT
    headers:
      Authorization: "Bearer {{ infomaniak_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      source: "{{ record.source if record.source != '' else '.' }}"
      type: "{{ record.type }}"
      target: "{{ _record_target }}"
      ttl: "{{ record.ttl }}"
    status_code: [200, 201]
    return_content: true
  register: update_result
  vars:
    _record_target: >-
      {{
        record.target
        if record.type != 'MX'
        else (
          record.target
          if record.target is string and record.target.startswith('10 ')
          else ('10 ' ~ record.target)
        )
      }}
    _key: "{{ (record.source if record.source != '' else '.') }}-{{ record.type }}-{{ _record_target }}"
    _matched: "{{ infomaniak_dns_present | selectattr('key', 'equalto', _key) | list }}"
    existing_entry: "{{ _matched[0] if _matched | length > 0 else {} }}"
  loop: "{{ zone_records }}"
  loop_control:
    loop_var: record
    label: "{{ record.source if record.source != '' else '.' }} ({{ record.type }})"
  when:
    - record.state == 'present'
    - record.ttl is defined
    - _matched | length > 0
    - existing_entry.ttl != record.ttl

- name: Delete DNS records for {{ zone_name }}
  ansible.builtin.uri:
    url: "{{ infomaniak_api_url }}{{ zone_name }}/records/{{ existing_entry.id }}"
    method: DELETE
    headers:
      Authorization: "Bearer {{ infomaniak_token }}"
    status_code: [200, 204]
    return_content: true
  register: delete_result
  vars:
    _record_target: >-
      {{
        record.target
        if record.type != 'MX'
        else (
          record.target
          if record.target is string and record.target.startswith('10 ')
          else ('10 ' ~ record.target)
        )
      }}
    _key: "{{ (record.source if record.source != '' else '.') }}-{{ record.type }}-{{ _record_target }}"
    _matched: "{{ infomaniak_dns_present | selectattr('key', 'equalto', _key) | list }}"
    existing_entry: "{{ _matched[0] if _matched | length > 0 else {} }}"
  loop: "{{ zone_records | selectattr('state', 'equalto', 'absent') | list }}"
  loop_control:
    loop_var: record
    label: "{{ (record.source if record.source != '' else '.') }} ({{ record.type }})"
  when:
    - _matched | length > 0