---
- name: Show applied tags
  ansible.builtin.debug:
    var: ansible_run_tags
  tags:
    - always

- name: Check OS and Version
  ansible.builtin.fail:
    msg: This is not Ubuntu 18.04 / 22.04
  when: ansible_distribution != "Ubuntu" and (ansible_distribution_major_version not in ['18', '22'])

- name: Include {{ role_name }} ubuntu1804 tasks
  ansible.builtin.include_tasks: "{{ role_name }}_ubuntu1804.yml"
  when: ansible_distribution_major_version == '18'
  tags:
    - bbb_install

- name: Include {{ role_name }} ubuntu2204 tasks
  ansible.builtin.include_tasks: "{{ role_name }}_ubuntu2204.yml"
  when: ansible_distribution_major_version == '22'
  tags:
    - bbb_install
